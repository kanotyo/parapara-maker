<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>かんたんパラパラ</title><style>*{box-sizing:border-box}body{margin:0;background:#fff7f1;color:#302724;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}main{max-width:680px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px 32px}h1{font-size:26px;margin:0}p{color:#6c5c55;margin:7px 0 17px}.stage{aspect-ratio:1;background:#fff;border:2px solid #ead9cf;border-radius:24px;display:grid;place-items:center;box-shadow:0 10px 27px #d6bdb166;overflow:hidden}.stage svg{width:100%;height:100%}.panel{margin-top:14px;background:#fff;border-radius:20px;padding:14px;box-shadow:0 4px 16px #eadad188}.choices,.controls{display:flex;gap:9px;flex-wrap:wrap}button{border:0;border-radius:14px;background:#f2e5de;color:#302724;padding:12px 14px;font-size:16px;font-weight:700}button.selected,button.primary{background:#ff7043;color:#fff}.strip{display:flex;gap:9px;overflow:auto;margin-top:12px}.frame{flex:0 0 72px;height:88px;border:3px solid transparent;border-radius:12px;background:#fff;padding:0;overflow:hidden}.frame.on{border-color:#ff7043}.frame svg{width:100%;height:100%}.help{font-size:13px;margin:10px 0 0}.speed{display:flex;align-items:center;gap:9px;margin-top:12px}input{accent-color:#ff7043;flex:1}footer{text-align:center;font-size:12px;color:#947e73;margin-top:18px}</style></head><body><main><h1>かんたんパラパラ</h1><p>絵は不要。動きを選ぶだけで、本物の連続コマを作ります。</p><section class="stage" id="stage"></section><section class="panel"><b>動きを選ぶ</b><div class="choices" style="margin-top:10px"><button class="selected" data-kind="walk">🚶 歩く</button><button data-kind="wave">👋 手を振る</button><button data-kind="jump">🕺 ジャンプ</button></div><div class="controls" style="margin-top:13px"><button id="make" class="primary">この動きで作る</button><button id="play">▶ 再生</button><button id="back">←</button><button id="next">→</button></div><div class="speed"><b>速さ</b><input id="speed" type="range" min="3" max="14" value="8"><span id="rate">8</span> コマ/秒</div><p class="help">「この動きで作る」を押すと8コマできます。下の小さな絵をタップすると、好きなコマから確認できます。</p></section><section class="panel"><b id="count">コマ：0枚</b><div class="strip" id="strip"></div></section><footer>写真も絵も必要ありません。端末内だけで動きます。</footer></main><script>
var stage=document.querySelector('#stage'),strip=document.querySelector('#strip'),count=document.querySelector('#count'),play=document.querySelector('#play'),speed=document.querySelector('#speed'),rate=document.querySelector('#rate'),kind='walk',frames=[],now=0,timer;
function S(a){return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="#fffdfb"/><path d="M12 98H88" stroke="#ead9cf" stroke-width="2"/><circle cx="50" cy="'+a.y+'" r="13" fill="none" stroke="#302724" stroke-width="4"/><path d="'+a.p+'" fill="none" stroke="#302724" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
function frame(k,n){var q=n/7*6.283,sa=Math.sin(q),co=Math.cos(q),p,y=32;if(k==='walk'){p='M50 45L50 75 M50 52L'+(50+18*sa)+' '+(70+9*co)+' M50 52L'+(50-18*sa)+' '+(70-9*co)+' M50 75L'+(50+18*sa)+' 97 M50 75L'+(50-18*sa)+' 97'}else if(k==='wave'){p='M50 45L50 75 M50 52L32 70 M50 52L'+(68+8*sa)+' '+(58-13*co)+' M50 75L38 97 M50 75L62 97'}else{var z=-14*Math.abs(sa);y=32+z;p='M50 '+(45+z)+'L50 '+(75+z)+' M50 '+(52+z)+'L30 '+(40+z)+' M50 '+(52+z)+'L70 '+(40+z)+' M50 '+(75+z)+'L37 '+(88+z)+' M50 '+(75+z)+'L63 '+(88+z)}return S({p:p,y:y})}
function render(){stage.innerHTML=frames[now]||'<div style="color:#9a8378;text-align:center">動きを選んで<br>「この動きで作る」を押してください</div>';count.textContent='コマ：'+frames.length+'枚';strip.innerHTML='';frames.forEach(function(s,i){var b=document.createElement('button');b.className='frame '+(i===now?'on':'');b.dataset.i=i;b.innerHTML=s;strip.appendChild(b)})}function stop(){clearInterval(timer);timer=null;play.textContent='▶ 再生'}function make(){stop();frames=[];for(var n=0;n<8;n++)frames.push(frame(kind,n));now=0;render()}document.querySelectorAll('[data-kind]').forEach(function(b){b.onclick=function(){kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(function(x){x.classList.remove('selected')});b.classList.add('selected')}});document.querySelector('#make').onclick=make;play.onclick=function(){if(!frames.length)make();if(timer){stop();return}play.textContent='■ 停止';timer=setInterval(function(){now=(now+1)%frames.length;render()},1000/+speed.value)};document.querySelector('#back').onclick=function(){if(frames.length){now=(now+7)%8;render()}};document.querySelector('#next').onclick=function(){if(frames.length){now=(now+1)%8;render()}};strip.onclick=function(e){var b=e.target.closest('[data-i]');if(b){now=+b.dataset.i;render()}};speed.oninput=function(){rate.textContent=speed.value;if(timer){stop();play.onclick()}};render();
</script><script src="export.js"></script><script src="keyboard.js"></script></body></html>
